<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lama</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87CEEB;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y; /* Bättre prestanda på mobil */
        }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #background {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%;
            background: url('background.png') center/cover no-repeat;
            z-index: 1;
        }
        
        #llama {
            position: absolute;
            width: 200px;
            height: 200px;
            background: url('llama.png?v=3') center/contain no-repeat;
            z-index: 2;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            will-change: transform; /* Viktigt för prestanda */
        }
        
        * { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="llama"></div>
    </div>

    <script>
        const llama = document.getElementById('llama');
        let posX = 0; // pixlar från centrum
        let posY = 0;

        // Långsammare och mjukare rörelse på mobil
        const speed = 12; // Lägre än innan = mindre lagg

        function updatePosition() {
            llama.style.transform = `translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px))`;
        }

        // Tangentbord (för padda/dator)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') posX -= speed * 2;
            if (e.key === 'ArrowRight') posX += speed * 2;
            if (e.key === 'ArrowUp') posY -= speed * 2;
            if (e.key === 'ArrowDown') posY += speed * 2;
            clampPosition();
            updatePosition();
        });

        // Touch för mobil – optimerad för svagare telefoner
        let lastTouchX = 0;
        let lastTouchY = 0;

        document.addEventListener('touchstart', e => {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            e.preventDefault();
            
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            const diffX = currentX - lastTouchX;
            const diffY = currentY - lastTouchY;
            
            posX += diffX * 0.8; // Lägre multiplikator = mindre hopp
            posY += diffY * 0.8;
            
            clampPosition();
            updatePosition();
            
            lastTouchX = currentX;
            lastTouchY = currentY;
        }, { passive: false });

        // Enkel begränsning – snabbare än Math.max/min varje gång
        function clampPosition() {
            const maxX = window.innerWidth / 2 - 100;
            const maxY = window.innerHeight / 2 - 100;
            if (posX > maxX) posX = maxX;
            if (posX < -maxX) posX = -maxX;
            if (posY > maxY) posY = maxY;
            if (posY < -maxY) posY = -maxY;
        }

        // Startposition
        updatePosition();
    </script>
</body>
</html>
