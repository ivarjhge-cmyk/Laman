<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lama</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        
        #background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('background.jpg') center/cover no-repeat;
            z-index: 1;
        }
        
        #ground {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
            background: url('ground.jpg') repeat-x bottom;
            background-size: auto 100%;
            z-index: 2;
            animation: scroll 30s linear infinite;
        }
        
        @keyframes scroll {
            0% { background-position: 0 0; }
            100% { background-position: -2000px 0; }
        }
        
        #llama {
            position: absolute;
            bottom: 18%;
            left: 50%;
            width: 120px;
            height: 120px;
            background: url('llama.png') center/contain no-repeat;
            transform: translateX(-50%);
            z-index: 3;
            transition: bottom 0.2s;
        }
        
        #llama.walk-left { animation: walk 0.8s steps(8) infinite; transform: translateX(-50%) scaleX(-1); }
        #llama.walk-right { animation: walk 0.8s steps(8) infinite; transform: translateX(-50%) scaleX(1); }
        
        @keyframes walk {
            0% { background-position: 0 0; }
            100% { background-position: -960px 0; } /* 8 steg à 120px */
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="ground"></div>
        <div id="llama"></div>
    </div>

    <script>
        const llama = document.getElementById('llama');
        const ground = document.getElementById('ground');
        let position = 50;
        let velocity = 0;
        let isLeft = false;
        let isRight = false;

        function update() {
            if (isLeft) { velocity = -3; llama.className = 'walk-left'; }
            else if (isRight) { velocity = 3; llama.className = 'walk-right'; }
            else { velocity *= 0.85; llama.className = ''; }

            position += velocity * 0.1;
            position = Math.max(10, Math.min(90, position));
            llama.style.left = position + '%';

            // Parallax på marken
            ground.style.backgroundPositionX = -(position * 30) + 'px';

            requestAnimationFrame(update);
        }

        // Tangentbord
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') isLeft = true;
            if (e.key === 'ArrowRight') isRight = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') isLeft = false;
            if (e.key === 'ArrowRight') isRight = false;
        });

        // Touch (svep eller håll nere på sidorna)
        let touchStartX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            const width = window.innerWidth;
            if (touchStartX < width / 2) isLeft = true;
            else isRight = true;
        });
        document.addEventListener('touchmove', e => {
            const diff = e.touches[0].clientX - touchStartX;
            if (diff > 20) isRight = true, isLeft = false;
            if (diff < -20) isLeft = true, isRight = false;
        });
        document.addEventListener('touchend', () => { isLeft = false; isRight = false; });

        update();
    </script>
</body>
</html>
