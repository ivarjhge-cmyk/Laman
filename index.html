<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lama</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87CEEB;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #background {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%;
            background: url('background.png') center/cover no-repeat;
            z-index: 1;
        }
        
        #llama {
            position: absolute;
            width: 200px;
            height: 200px;
            background: url('llama.png?=v2') center/contain no-repeat;
            z-index: 2;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); /* Startposition */
            pointer-events: none;
            transition: transform 0.1s ease-out; /* Gör rörelsen extra len */
            will-change: transform; /* Berättar för webbläsaren att optimera */
        }
        
        * { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="llama"></div>
    </div>

    <script>
        const llama = document.getElementById('llama');
        let posX = 0; // i pixlar från centrum
        let posY = 0;

        const speed = 18; // Hur snabbt den rör sig (högre = snabbare)

        function updatePosition() {
            llama.style.transform = `translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px))`;
        }

        // Tangentbord (dator)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') posX -= speed;
            if (e.key === 'ArrowRight') posX += speed;
            if (e.key === 'ArrowUp') posY -= speed;
            if (e.key === 'ArrowDown') posY += speed;
            
            // Begränsa så laman inte åker utanför skärmen
            posX = Math.max(-window.innerWidth/2 + 100, Math.min(window.innerWidth/2 - 100, posX));
            posY = Math.max(-window.innerHeight/2 + 100, Math.min(window.innerHeight/2 - 100, posY));
            
            updatePosition();
        });

        // Touch (mobil – svep)
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            e.preventDefault();
            const diffX = e.touches[0].clientX - touchStartX;
            const diffY = e.touches[0].clientY - touchStartY;

            posX += diffX * 1.2; // Lite extra känslighet
            posY += diffY * 1.2;

            // Begränsa rörelse
            posX = Math.max(-window.innerWidth/2 + 100, Math.min(window.innerWidth/2 - 100, posX));
            posY = Math.max(-window.innerHeight/2 + 100, Math.min(window.innerHeight/2 - 100, posY));

            updatePosition();

            // Uppdatera startpunkt för nästa rörelse (gör det kontinuerligt)
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });
    </script>
</body>
</html>
