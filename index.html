<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lama</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87CEEB; /* Ljusblå himmel som fallback */
            -webkit-tap-highlight-color: transparent; /* Ingen blå markering på mobil */
            touch-action: manipulation; /* Bättre touch-respons */
        }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #background {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%;
            background: url('background.png') center/cover no-repeat;
            z-index: 1;
        }
        
        #llama {
            position: absolute;
            width: 200px; /* Stor och tydlig */
            height: 200px;
            background: url('llama.png') center/contain no-repeat;
            z-index: 2;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Så laman inte stör touch */
        }
        
        /* Ingen blå highlight vid touch */
        * { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="llama"></div>
    </div>

    <script>
        const llama = document.getElementById('llama');
        let posX = 50; // procent
        let posY = 50; // procent

        function updatePosition() {
            llama.style.left = posX + '%';
            llama.style.top = posY + '%';
        }

        // Tangentbord (dator: pil-tangenter)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') posX = Math.max(10, posX - 5);
            if (e.key === 'ArrowRight') posX = Math.min(90, posX + 5);
            if (e.key === 'ArrowUp') posY = Math.max(10, posY - 5);
            if (e.key === 'ArrowDown') posY = Math.min(90, posY + 5);
            updatePosition();
        });

        // Touch (mobil: svep i fyra riktningar)
        let touchStartX = 0;
        let touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault(); // Förhindra scroll och markering
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            e.preventDefault(); // Viktigt för att undvika markering/scroll
            const diffX = e.touches[0].clientX - touchStartX;
            const diffY = e.touches[0].clientY - touchStartY;

            if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // Horisontell svep
                    if (diffX > 0) posX = Math.min(90, posX + 8);
                    else posX = Math.max(10, posX - 8);
                } else {
                    // Vertikal svep
                    if (diffY > 0) posY = Math.min(90, posY + 8);
                    else posY = Math.max(10, posY - 8);
                }
                updatePosition();
                touchStartX = e.touches[0].clientX; // För kontinuerlig rörelse
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: false });

        updatePosition();
    </script>
</body>
</html>
