<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lama</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87CEEB;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            height: 100vh;
        }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #background {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%;
            background: url('background.png') center/cover no-repeat;
            z-index: 1;
        }
        
        #llama {
            position: absolute;
            width: 200px;
            height: 200px;
            background: url('llama.png?v=2') center/contain no-repeat; /* ?v=2 för att tvinga ny bild */
            z-index: 2;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }
        
        #snow-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        
        #snow-container.active {
            opacity: 1;
        }
        
        .snowflake {
            position: absolute;
            color: white;
            font-size: 1.5em;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }
        
        #jultext {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-family: Arial, sans-serif;
            font-size: 3.5em;
            font-weight: bold;
            color: red;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.7);
            z-index: 5;
            opacity: 0;
            transition: opacity 2s ease-in;
            pointer-events: none;
            white-space: nowrap;
        }
        
        #jultext.active {
            opacity: 1;
        }
        
        /* Knappen flyttad längst upp */
        #snow-button {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            font-size: 1.4em;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }
        
        #snow-button:hover {
            background: white;
            transform: translateX(-50%) scale(1.05);
        }
        
        * { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="llama"></div>
        <div id="snow-container"></div>
        <div id="jultext">God Jul Laman</div>
        <button id="snow-button">🎄 Starta snöfall</button>
    </div>

    <script>
        // Vänta tills hela sidan är laddad innan vi kopplar knappen
        document.addEventListener('DOMContentLoaded', () => {
            const snowContainer = document.getElementById('snow-container');
            const jultext = document.getElementById('jultext');
            const button = document.getElementById('snow-button');

            button.addEventListener('click', () => {
                snowContainer.classList.add('active');
                jultext.classList.add('active');
                button.style.display = 'none'; // Döljer knappen efter klick
                createSnowflakes();
            });

            function createSnowflakes() {
                if (snowContainer.children.length > 0) return; // Undviker dubbla snöflingor om man klickar flera gånger
                for (let i = 0; i < 100; i++) {
                    const flake = document.createElement('div');
                    flake.classList.add('snowflake');
                    flake.textContent = ['❄', '❅', '❆'][Math.floor(Math.random() * 3)];
                    flake.style.left = Math.random() * 100 + 'vw';
                    flake.style.animationDuration = (Math.random() * 6 + 6) + 's';
                    flake.style.opacity = Math.random() * 0.7 + 0.3;
                    flake.style.fontSize = (Math.random() * 1.2 + 1) + 'em';
                    flake.style.animationDelay = Math.random() * 5 + 's';
                    snowContainer.appendChild(flake);
                }
            }
        });
