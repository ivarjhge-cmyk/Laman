<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lama</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87CEEB;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y;
            height: 100vh;
        }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #background {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%;
            background: url('background.png') center/cover no-repeat;
            z-index: 1;
        }
        
        #llama {
            position: absolute;
            width: 200px;
            height: 200px;
            background: url('llama.png?v=3') center/contain no-repeat;
            z-index: 2;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            will-change: transform;
            transition: transform 0.05s ease-out;
        }
        
        * { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="llama"></div>
    </div>

    <script>
        const llama = document.getElementById('llama');
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        const smoothing = 0.15; // Len följning

        function updatePosition() {
            currentX += (targetX - currentX) * smoothing;
            currentY += (targetY - currentY) * smoothing;
            
            llama.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px))`;
            
            requestAnimationFrame(updatePosition);
        }

        // Tangentbord
        window.addEventListener('keydown', e => {
            const step = 40;
            if (e.key === 'ArrowLeft') targetX -= step;
            if (e.key === 'ArrowRight') targetX += step;
            if (e.key === 'ArrowUp') targetY -= step;
            if (e.key === 'ArrowDown') targetY += step;
            clampTarget();
        });

        // Touch
        let lastTouchX = 0;
        let lastTouchY = 0;

        document.addEventListener('touchstart', e => {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            e.preventDefault();
            
            const currentTouchX = e.touches[0].clientX;
            const currentTouchY = e.touches[0].clientY;
            
            const deltaX = currentTouchX - lastTouchX;
            const deltaY = currentTouchY - lastTouchY;
            
            targetX += deltaX * 1.2; // Lite högre känslighet på mobil
            targetY += deltaY * 1.2;
            
            clampTarget();
            
            lastTouchX = currentTouchX;
            lastTouchY = currentTouchY;
        }, { passive: false });

        // STÖRRE RÖRELSEOMRÅDE – laman går MYCKET längre ut
        function clampTarget() {
            const halfWidth = window.innerWidth / 2;
            const halfHeight = window.innerHeight / 2;
            const llamaHalfSize = 100; // 200px / 2

            // Mycket liten marginal – bara 30px från kanten
            const margin = 30;

            const maxX = halfWidth - llamaHalfSize + margin; // Tillåter att laman går långt ut
            const maxY = halfHeight - llamaHalfSize + margin;

            targetX = Math.max(-maxX, Math.min(maxX, targetX));
            targetY = Math.max(-maxY, Math.min(maxY, targetY));
        }

        updatePosition();
    </script>
</body>
</html>
