<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>God Jul Mamma! ❤️</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        .layer { position: absolute; width: 100%; height: 100%; background-repeat: repeat-x; background-size: auto 100%; }
        #sky { background: linear-gradient(#87CEEB, #E0F7FA); z-index: 1; }
        #mountains { background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80') no-repeat center bottom; background-size: cover; z-index: 2; }
        #hills { background: url('https://images.unsplash.com/photo-1540974959261-32d9e3b9f0e9?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80') no-repeat center bottom; background-size: cover; z-index: 3; }
        #ground { background: url('https://images.unsplash.com/photo-1509316785353-2c7e104d2e6d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80') repeat-x center bottom; background-size: auto 100%; z-index: 4; animation: scroll 40s linear infinite; }
        @keyframes scroll { 0% { background-position: 0 0; } 100% { background-position: -2000px 0; } }
        #llama { position: absolute; bottom: 20%; left: 50%; width: 100px; height: 100px; background: url('https://gameartpartnersimagehost.s3.amazonaws.com/wp-content/uploads/edd/2015/07/llama2.jpg') 0 0; background-size: 800% 100%; z-index: 5; transform: translateX(-50%); transition: bottom 0.2s; }
        #llama.walk-left { animation: walk 0.8s steps(8) infinite; transform: translateX(-50%) scaleX(-1); }
        #llama.walk-right { animation: walk 0.8s steps(8) infinite; transform: translateX(-50%) scaleX(1); }
        @keyframes walk { 0% { background-position: 0 0; } 100% { background-position: -800px 0; } }
        #message { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); font-size: 2em; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); z-index: 10; text-align: center; }
        #controls { position: absolute; bottom: 0; width: 100%; height: 150px; z-index: 10; display: flex; }
        .control { flex: 1; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 3em; color: white; user-select: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sky" class="layer"></div>
        <div id="mountains" class="layer"></div>
        <div id="hills" class="layer"></div>
        <div id="ground" class="layer"></div>
        <div id="message">God Jul Mamma! ❤️<br>Svep höger/vänster för att styra laman!</div>
        <div id="llama"></div>
        <div id="controls">
            <div class="control" id="left">←</div>
            <div class="control" id="right">→</div>
        </div>
    </div>

    <script>
        const llama = document.getElementById('llama');
        const ground = document.getElementById('ground');
        let position = 50; // procent från vänster
        let velocity = 0;
        let isLeft = false;
        let isRight = false;

        function update() {
            if (isLeft) { velocity = -2; llama.className = 'walk-left'; }
            else if (isRight) { velocity = 2; llama.className = 'walk-right'; }
            else { velocity *= 0.9; llama.className = ''; }

            position += velocity;
            position = Math.max(0, Math.min(100, position));
            llama.style.left = position + '%';

            // Parallax för ground
            ground.style.backgroundPositionX = -(position * 20) + 'px';

            requestAnimationFrame(update);
        }

        // Tangentbord (för dator)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') isLeft = true;
            if (e.key === 'ArrowRight') isRight = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') isLeft = false;
            if (e.key === 'ArrowRight') isRight = false;
        });

        // Touch/mus för mobil
        document.getElementById('left').addEventListener('touchstart', () => isLeft = true);
        document.getElementById('left').addEventListener('touchend', () => isLeft = false);
        document.getElementById('right').addEventListener('touchstart', () => isRight = true);
        document.getElementById('right').addEventListener('touchend', () => isRight = false);

        // Svep på hela skärmen
        let touchStartX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
        document.addEventListener('touchmove', e => {
            const diff = e.touches[0].clientX - touchStartX;
            if (Math.abs(diff) > 30) {
                if (diff > 0) isRight = true, isLeft = false;
                else isLeft = true, isRight = false;
            }
        });
        document.addEventListener('touchend', () => { isLeft = false; isRight = false; });

        update();
    </script>
</body>
</html>
