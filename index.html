<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lama</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87CEEB;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y;
            height: 100vh;
        }
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #background {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%;
            background: url('background.png') center/cover no-repeat;
            z-index: 1;
        }
        
        #llama {
            position: absolute;
            width: 200px;
            height: 200px;
            background: url('llama.png?v=3') center/contain no-repeat;
            z-index: 2;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            will-change: transform;
            transition: transform 0.05s ease-out; /* Liten mjuk transition för extra len känsla */
        }
        
        * { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="llama"></div>
    </div>

    <script>
        const llama = document.getElementById('llama');
        let targetX = 0; // Målposition
        let targetY = 0;
        let currentX = 0; // Nuvarande (mjuk)
        let currentY = 0;

        const smoothing = 0.15; // Högre värde = långsammare men lenare följning (0.1–0.2 är bra)

        function updatePosition() {
            // Mjuk interpolation (lerp) – eliminerar skakning
            currentX += (targetX - currentX) * smoothing;
            currentY += (targetY - currentY) * smoothing;
            
            llama.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px))`;
            
            requestAnimationFrame(updatePosition); // Kontinuerlig loop för silkeslen rörelse
        }

        // Tangentbord (padda/dator – snabb respons)
        window.addEventListener('keydown', e => {
            const step = 30;
            if (e.key === 'ArrowLeft') targetX -= step;
            if (e.key === 'ArrowRight') targetX += step;
            if (e.key === 'ArrowUp') targetY -= step;
            if (e.key === 'ArrowDown') targetY += step;
            clampTarget();
        });

        // Touch (mobil – mjuk följning)
        let lastTouchX = 0;
        let lastTouchY = 0;

        document.addEventListener('touchstart', e => {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            e.preventDefault();
            
            const currentTouchX = e.touches[0].clientX;
            const currentTouchY = e.touches[0].clientY;
            
            const deltaX = currentTouchX - lastTouchX;
            const deltaY = currentTouchY - lastTouchY;
            
            targetX += deltaX * 1.0; // Känslighet – justera ner om för snabb
            targetY += deltaY * 1.0;
            
            clampTarget();
            
            lastTouchX = currentTouchX;
            lastTouchY = currentTouchY;
        }, { passive: false });

        function clampTarget() {
            const maxX = window.innerWidth / 2 - 110;
            const maxY = window.innerHeight / 2 - 110;
            targetX = Math.max(-maxX, Math.min(maxX, targetX));
            targetY = Math.max(-maxY, Math.min(maxY, targetY));
        }

        // Starta den mjuk animationen
        updatePosition();
    </script>
</body>
</html>
